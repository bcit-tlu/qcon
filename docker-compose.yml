name: ${APP_NAME:-qcon}

services:
  app:
    build:
      context: .
      target: builder
      platforms:
        - linux/amd64
        - linux/arm64

    command: npm run preview

    environment:
      - DEBUG=true
      - CI=false
      - NODE_ENV=development

    volumes:
      - /app/node_modules
      - ./:/app

    ports:
      - "9000:9000"
